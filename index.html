<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบบันทึกการเดินทาง</title>
    
    <!-- นำเข้าแผนที่ Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- นำเข้า LIFF SDK สำหรับเชื่อมต่อ LINE -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

    <style>
       /* นำเข้าฟอนต์ Prompt จาก Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap');

        body { 
            font-family: 'Prompt', sans-serif; 
            text-align: center; 
            padding: 20px; 
            /* ไล่สีพื้นหลังให้ดูสดใสแบบพรีเมียม */
            background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%); 
            min-height: 100vh;
            margin: 0; 
            color: #2c3e50;
        }

        .container { 
            max-width: 400px; 
            margin: 0 auto; 
            background: rgba(255, 255, 255, 0.95); 
            padding: 35px 25px; 
            border-radius: 24px; /* ขอบกล่องโค้งมน */
            box-shadow: 0 15px 35px rgba(0,0,0,0.15); /* เงาฟุ้งๆ */
            backdrop-filter: blur(10px);
        }

        h2 { font-weight: 600; color: #1a252f; margin-top: 0; margin-bottom: 25px; }

        label { display: block; text-align: left; font-size: 14px; margin-bottom: 5px; color: #555; }

        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 14px 16px; 
            margin-bottom: 20px; 
            border: 2px solid #e1e5eb; 
            border-radius: 12px; 
            box-sizing: border-box; 
            font-family: 'Prompt', sans-serif;
            font-size: 15px;
            background-color: #f8f9fa;
            transition: all 0.3s ease;
        }

        /* เอฟเฟกต์ตอนกดช่องกรอกข้อมูล */
        input[type="text"]:focus, input[type="password"]:focus {
            border-color: #007bff;
            outline: none;
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(0,123,255,0.1);
        }

        button { 
            border: none; 
            padding: 14px 20px; 
            font-size: 16px; 
            font-weight: 500;
            font-family: 'Prompt', sans-serif;
            border-radius: 14px; 
            cursor: pointer; 
            width: 100%; 
            margin-bottom: 12px; 
            color: white;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        /* เอฟเฟกต์ปุ่มยุบตัวเวลาโดนกด */
        button:active { transform: scale(0.96); }
        button:disabled { background: #cccccc !important; cursor: not-allowed; box-shadow: none; transform: none; }
        
        /* ตกแต่งสีปุ่มแบบ Gradient */
        .btn-primary { background: linear-gradient(135deg, #007bff, #0056b3); } 
        .btn-primary:hover { box-shadow: 0 6px 20px rgba(0,123,255,0.3); }
        
        .btn-success { background: linear-gradient(135deg, #28a745, #20c997); } 
        .btn-success:hover { box-shadow: 0 6px 20px rgba(40,167,69,0.3); }
        
        .btn-warning { background: linear-gradient(135deg, #ffc107, #ff9800); color: #fff; } 
        .btn-warning:hover { box-shadow: 0 6px 20px rgba(255,193,7,0.3); }
        
        .btn-danger { background: linear-gradient(135deg, #dc3545, #c82333); margin-top: 15px; } 
        .btn-danger:hover { box-shadow: 0 6px 20px rgba(220,53,69,0.3); }
        
        #lineLoginBtn { background: linear-gradient(135deg, #06C755, #05a546) !important; font-weight: 600; letter-spacing: 0.5px; }
        
        #statusText, #appStatus { font-size: 14px; margin-bottom: 15px; min-height: 20px; font-weight: 400; }
        
        #map { height: 320px; width: 100%; border-radius: 16px; display: none; margin-top: 15px; z-index: 1; border: 2px solid #f0f0f0; }
        
        .custom-photo-marker { border-radius: 50%; border: 3px solid white; box-shadow: 0 5px 15px rgba(0,0,0,0.4); object-fit: cover; }
        
        .hidden { display: none !important; }
        .leaflet-routing-container { display: none !important; }
    </style>
</head>
<body>

    <!-- เอาคลาส hidden ออก เพื่อให้โชว์หน้าล็อกอินทันทีที่เปิดเว็บ -->
    <div class="container" id="mainContainer">
        <!-- 1. หน้าเข้าสู่ระบบ -->
        <div id="authSection">
            <h2>🔐 เข้าสู่ระบบ</h2>
            <p id="statusText" style="color: #dc3545;"></p>
            <div style="text-align: left;">
                <label><b>ชื่อผู้ใช้งาน</b></label>
                <input type="text" id="usernameInput" placeholder="กรอกชื่อผู้ใช้">
                
                <label><b>รหัสผ่าน</b></label>
                <input type="password" id="passwordInput" placeholder="กรอกรหัสผ่าน">
            </div>
            <button id="loginBtn" class="btn-primary">เข้าสู่ระบบ</button>
            <button id="registerBtn" class="btn-success">สมัครสมาชิกใหม่</button>

            <!-- เพิ่มเส้นคั่น และปุ่มล็อกอินด้วย LINE -->
            <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">
            <button id="lineLoginBtn" style="background-color: #06C755; color: white; font-weight: bold;">💬 ล็อกอินด้วย LINE</button>
        </div>

        <!-- 2. หน้าแอปพลิเคชันหลัก -->
        <div id="appSection" class="hidden">
            <h2>📍 ระบบติดตามการเดินทาง</h2>
            <p style="text-align: left; margin-bottom: 20px;">ผู้ใช้งาน: <strong id="displayUsername" style="color:#007bff;"></strong></p>

            <button id="startTripBtn" class="btn-success" style="padding: 15px; font-size: 18px;">🚗 เริ่มการเดินทาง</button>

            <div id="tripControls" class="hidden">
                <div style="margin-bottom: 15px; text-align: left; background: #e9ecef; padding: 10px; border-radius: 8px;">
                    <label for="cameraInput" style="font-weight: bold; font-size: 14px;">📸 ถ่ายรูปสถานที่</label><br>
                    <input type="file" id="cameraInput" accept="image/*" capture="environment" style="margin-top: 5px; width: 100%;">
                </div>
                <button id="checkinBtn" class="btn-primary">📍 บันทึกพิกัด (เช็คอิน)</button>
                <button id="endTripBtn" class="btn-warning">🏁 สิ้นสุดการเดินทาง</button>
            </div>

            <p id="appStatus"></p>
            <div id="map"></div>

            <!-- ส่วนแสดงผลสรุป (Strava Style) -->
            <div id="summarySection" class="hidden" style="margin-top: 15px; background: white; padding: 25px 20px; border-radius: 10px; box-shadow: 0 -5px 20px rgba(0,0,0,0.15); position: relative; z-index: 10;">
                <p style="font-size: 14px; color: gray; margin: 0;">🎉 สรุปเส้นทางการเดินทาง</p>
                <h1 style="font-size: 45px; margin: 5px 0;">
                    <span id="summaryDistance" style="color: #111;">0.00</span> <span style="font-size: 20px; color: #555;">km</span>
                </h1>
                <p style="color: gray; font-size: 12px; letter-spacing: 2px; margin-bottom: 20px; font-weight: bold;">DISTANCE</p>
                <p style="font-size: 16px; border-top: 1px solid #eee; padding-top: 15px;">📍 แวะถ่ายรูปและเช็คอินทั้งหมด: <b id="summaryStops" style="color:#007bff;">0</b> จุด</p>
                <button id="closeSummaryBtn" class="btn-success" style="margin-top: 10px;">✅ เสร็จสิ้น (กลับหน้าหลัก)</button>
            </div>

            <button id="logoutBtn" class="btn-danger">ออกจากระบบ</button>
            <button id="openExternalBtn" style="background-color: #6c757d; color: white; border: none; padding: 12px; width: 100%; margin-top: 10px; border-radius: 5px;">🌐 เปิดหน้าเว็บในเบราเซอร์</button>
        </div>
    </div>

    <script>
        // 🛑 ใส่ Web App URL ของคุณที่นี่
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwvEJM9M3XdRXUmwrzBu0YDmH-Ft1B-nbbwrW1KWfAHGB9jnBzam_if0VlpAOr0P_hjQg/exec';
        
        let liffUserId = ""; 
        let myMap = null, currentUser = "", currentTripId = null;
        let routeCoordinates = [], routeLine = null;

        // --- ระบบ LIFF แอบทำงานอยู่หลังบ้านเงียบๆ ---
        async function initializeLiff() {
            try {
                // 🛑 ใส่ LIFF ID ของคุณ
                await liff.init({ liffId: "2011078075-i7j9DKxk" }); 
                
                if (liff.isLoggedIn()) {
                    const profile = await liff.getProfile();
                    liffUserId = profile.userId; 
                    currentUser = profile.displayName; 

                    callAPI({ action: 'register', username: currentUser, password: 'LINE_LOGIN', lineUserId: liffUserId }, () => {});

                    document.getElementById('displayUsername').innerText = currentUser;
                    document.getElementById('authSection').classList.add('hidden');
                    document.getElementById('appSection').classList.remove('hidden');
                } 
                // ไม่ต้องแสดงหน้าจอโหลดแล้ว ปล่อยให้มันทำงานไป
            } catch (err) {
                console.log("LIFF Init Error: ", err.message);
            }
        }
        
        initializeLiff();

        document.getElementById('lineLoginBtn').addEventListener('click', () => {
            if (!liff.isLoggedIn()) {
                liff.login(); 
            }
        });

        const callAPI = (payload, callback) => {
            fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) })
            .then(res => res.json()).then(callback).catch(err => console.log(err));
        };

        const handleAuth = (action) => {
            const user = document.getElementById('usernameInput').value.trim();
            const pass = document.getElementById('passwordInput').value.trim();

            if(!user || !pass) return document.getElementById('statusText').innerText = "กรุณากรอกชื่อและรหัสผ่าน";
            document.getElementById('statusText').innerText = "กำลังประมวลผล...";
            
            callAPI({ action: action, username: user, password: pass, lineUserId: liffUserId }, (data) => {
                if(data.status === 'success') {
                    currentUser = user; 
                    document.getElementById('displayUsername').innerText = currentUser;
                    document.getElementById('authSection').classList.add('hidden'); 
                    document.getElementById('appSection').classList.remove('hidden');
                } else {
                    document.getElementById('statusText').innerText = data.message;
                }
            });
        };
        
        document.getElementById('loginBtn').addEventListener('click', () => handleAuth('login'));
        document.getElementById('registerBtn').addEventListener('click', () => handleAuth('register'));
        
        document.getElementById('logoutBtn').addEventListener('click', () => { 
            if (liff.isLoggedIn()) {
                liff.logout();
            }
            location.reload(); 
        });
        
        document.getElementById('openExternalBtn').addEventListener('click', () => {
            if(liff.isInClient()){
                liff.openWindow({ url: 'https://beeqw35564.github.io/travel-app/', external: true });
            } else {
                alert("คุณเปิดผ่านเบราเซอร์อยู่แล้วครับ!");
            }
        });

        function calculateDistance(coords) {
            let total = 0;
            if (coords.length < 2) return "0.00";
            for (let i = 0; i < coords.length - 1; i++) {
                let p1 = L.latLng(coords[i][0], coords[i][1]);
                let p2 = L.latLng(coords[i+1][0], coords[i+1][1]);
                total += p1.distanceTo(p2); 
            }
            return (total / 1000).toFixed(2); 
        }

        document.getElementById('startTripBtn').addEventListener('click', () => {
            currentTripId = "TRIP_" + new Date().getTime(); 
            routeCoordinates = []; 
            if(routeLine && myMap) myMap.removeLayer(routeLine);
            
            document.getElementById('startTripBtn').classList.add('hidden');
            document.getElementById('tripControls').classList.remove('hidden');
            document.getElementById('appStatus').innerText = "กำลังแจ้งเตือนระบบว่าเริ่มเดินทาง...";

            callAPI({ action: 'notify', type: 'start', username: currentUser, tripId: currentTripId }, (data) => {
                if(data.status === 'success') {
                    document.getElementById('appStatus').innerHTML = "🚀 เริ่มการเดินทางแล้ว!<br>ระบบส่งข้อความแจ้งเตือนเข้า LINE เรียบร้อย";
                    document.getElementById('appStatus').style.color = "#28a745";
                } else {
                    document.getElementById('appStatus').innerHTML = "เริ่มการเดินทางแล้ว (แจ้งเตือน LINE ไม่สำเร็จ: " + data.message + ")";
                }
            });
        });

        document.getElementById('checkinBtn').addEventListener('click', () => {
            if (!navigator.geolocation) return;
            const btn = document.getElementById('checkinBtn');
            const status = document.getElementById('appStatus');
            btn.disabled = true; status.innerText = "กำลังค้นหาพิกัดและวาดแผนที่..."; status.style.color = "black";

            navigator.geolocation.getCurrentPosition((position) => {
                const lat = position.coords.latitude, lng = position.coords.longitude;
                document.getElementById('map').style.display = 'block';

                if (!myMap) {
                    myMap = L.map('map').setView([lat, lng], 15);
                    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(myMap);
                } else {
                    myMap.setView([lat, lng], 15);
                }

                routeCoordinates.push([lat, lng]);
                if(routeCoordinates.length > 1) {
                    if(routeLine) myMap.removeLayer(routeLine);
                    routeLine = L.polyline(routeCoordinates, {color: 'blue', weight: 4}).addTo(myMap);
                }

                const sendCheckinData = (base64) => {
                    callAPI({ action: 'checkin', username: currentUser, tripId: currentTripId, lat: lat, lng: lng, imageBase64: base64 }, (data) => {
                        if(data.status === 'success') status.innerHTML = `✅ บันทึกจุดที่ ${routeCoordinates.length} สำเร็จ!`;
                        btn.disabled = false;
                    });
                };

                const fileInput = document.getElementById('cameraInput');
                if (fileInput && fileInput.files.length > 0) {
                    const reader = new FileReader();
                    reader.onloadend = function(e) {
                        const customIcon = L.icon({ iconUrl: e.target.result, iconSize: [40, 40], className: 'custom-photo-marker' });
                        L.marker([lat, lng], {icon: customIcon}).addTo(myMap).bindPopup("จุดที่ " + routeCoordinates.length).openPopup();
                        sendCheckinData(reader.result); 
                    };
                    reader.readAsDataURL(fileInput.files[0]); 
                } else {
                    L.marker([lat, lng]).addTo(myMap).bindPopup("จุดที่ " + routeCoordinates.length).openPopup();
                    sendCheckinData(""); 
                }
            }, null, { enableHighAccuracy: true });
        });

        document.getElementById('endTripBtn').addEventListener('click', () => {
            if(confirm("คุณต้องการสิ้นสุดการเดินทางนี้ใช่หรือไม่?")) {
                document.getElementById('tripControls').classList.add('hidden');
                document.getElementById('appStatus').innerText = "กำลังสรุปผลเส้นทาง...";

                const totalDistance = calculateDistance(routeCoordinates);

                callAPI({ action: 'notify', type: 'end', username: currentUser, tripId: currentTripId, totalStops: routeCoordinates.length }, () => {
                    document.getElementById('appStatus').innerText = "";

                    if (routeLine && myMap) {
                        myMap.fitBounds(routeLine.getBounds(), { padding: [40, 40] });
                    }

                    document.getElementById('summaryStops').innerText = routeCoordinates.length;
                    document.getElementById('summaryDistance').innerText = totalDistance;
                    document.getElementById('summarySection').classList.remove('hidden');

                    currentTripId = null;
                });
            }
        });

        document.getElementById('closeSummaryBtn').addEventListener('click', () => {
            document.getElementById('summarySection').classList.add('hidden');
            document.getElementById('startTripBtn').classList.remove('hidden');
            document.getElementById('map').style.display = 'none';
            document.getElementById('appStatus').innerText = "";
            
            if (myMap) {
                myMap.eachLayer((layer) => {
                    if (layer instanceof L.Marker || layer instanceof L.Polyline) {
                        myMap.removeLayer(layer);
                    }
                });
            }
        });
    </script>
</body>
</html>
